@if (isLoading) {
  <div class="min-h-screen bg-[#FFFFFF] flex items-center justify-center">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-orange"></div>
  </div>
}

@if (!isLoading && category) {
  <div class="min-h-screen bg-[#FFFFFF] flex flex-col pb-20">
    <div class="w-full max-w-[1600px] mx-auto px-4 lg:px-6 lg:px-8">
      <!-- Breadcrumb (Desktop Only) -->
      <div class="hidden md:block pt-4 pb-2">
        <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
      </div>
      <!-- Title & Subtitle + Filter/Sort Button -->
      <div class="pt-4 pb-2 flex justify-between items-start">
        <div class="flex-1 pr-4">
          <div class="lg:hidden flex items-center gap-2">
            <button
              routerLink="/categories"
              class="flex-shrink-0 p-1.5 -ml-1.5 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors text-[#111111]"
            >
              <ng-icon name="lucideArrowLeft" class="text-[24px]"></ng-icon>
            </button>
            <h1 class="text-[20px] font-bold text-[#111111] leading-none pt-0.5 truncate">
              {{ category.name }}
            </h1>
          </div>
          <h1 class="hidden lg:block text-2xl md:text-3xl font-bold text-[#111111]">
            {{ category.name }}
          </h1>
        </div>
      </div>
      <!-- Category Chips Row -->
      <div class="w-full overflow-x-auto scrollbar-hide mt-5 pb-1 -mx-4 px-4 lg:mx-0 lg:px-0">
        <div class="flex items-center gap-3 w-max">
          <div
            class="h-[44px] px-4 rounded-full border border-brand-orange text-[#FF6A00] font-medium flex items-center justify-center cursor-pointer whitespace-nowrap"
          >
            All {{ category.name }}
          </div>
          @for (child of subcategories; track child) {
            <div
              [routerLink]="['/collections', child.slug]"
              class="h-[44px] px-4 rounded-full border border-[#EAEAEA] text-[#111111] font-medium flex items-center justify-center hover:border-brand-orange/30 cursor-pointer transition-colors whitespace-nowrap"
            >
              {{ child.name }}
            </div>
          }
        </div>
      </div>
      <!-- Count Row -->
      <div class="mt-6 flex items-center">
        <span class="text-[14px] font-semibold text-[#111111]">{{ totalItems }} items</span>
      </div>
      <!-- Product Category Cards (2-column Grid) -->
      <div
        class="mt-4 grid grid-cols-2 gap-x-3 gap-y-4 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 mb-12"
      >
        @for (child of subcategories; track child) {
          <app-category-card [category]="child" layout="subcategory"></app-category-card>
        }
      </div>
      <!-- Promo Banner -->
      <app-promo-banners></app-promo-banners>
    </div>
  </div>
}
