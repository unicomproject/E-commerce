<!-- Page Layout for Mobile/Desktop -->
<div class="flex min-h-screen flex-col bg-[#FFFFFF] pb-20">
  <div class="w-full max-w-[1600px] mx-auto px-4 lg:px-6 lg:px-8">
    <!-- Desktop Breadcrumbs -->
    <div class="hidden lg:block pt-4 pb-2">
      <app-breadcrumbs [items]="breadcrumbItems"></app-breadcrumbs>
    </div>

    <!-- Mobile Title -->
    <app-mobile-header title="Shop by Category" backLink="/"></app-mobile-header>

    <!-- Category grid: mobile 1 · tablet 2 · desktop 3 -->
    <div class="py-2">
      @if (categories$ | async; as categories) {
        <div class="grid grid-cols-1 gap-3 md:grid-cols-2 lg:grid-cols-3 lg:gap-4">
          @for (category of categories; track category) {
            <app-category-card [category]="category" layout="list"></app-category-card>
          }
        </div>
      } @else {
        <div class="grid grid-cols-1 gap-3 md:grid-cols-2 lg:grid-cols-3 lg:gap-4">
          @for (i of [1, 2, 3, 4, 5, 6]; track i) {
            <div
              class="flex h-[88px] animate-pulse items-center rounded-xl border border-gray-100 bg-white p-4"
            >
              <div class="h-[48px] w-[48px] flex-shrink-0 rounded-xl bg-gray-200"></div>
              <div class="ml-4 flex-1">
                <div class="mb-2 h-4 w-1/3 rounded bg-gray-200"></div>
                <div class="h-3 w-1/2 rounded bg-gray-200"></div>
              </div>
            </div>
          }
        </div>
      }
    </div>

    <!-- Bottom CTA Strip -->
    @if (!authService.isAuthenticated) {
      <div
        class="mx-4 mt-4 flex flex-row items-center justify-between rounded-xl bg-[#FFF1E6] p-4 shadow-sm lg:mx-8"
      >
        <div class="flex items-center gap-3">
          <ng-icon name="lucideTag" class="flex-shrink-0 text-[24px] text-brand-orange"></ng-icon>
          <span class="max-w-[160px] text-[12px] font-medium leading-tight text-brand-black"
            >Sign in for a better experience</span
          >
        </div>
        <button
          routerLink="/account"
          class="flex h-[36px] flex-shrink-0 items-center rounded-lg bg-brand-orange px-4 text-[14px] font-semibold text-white transition-colors hover:bg-brand-orange-dark"
        >
          Sign in / Register
        </button>
      </div>
    }
  </div>
</div>
