<div class="bg-white rounded-[24px] shadow-sm border border-gray-100 overflow-hidden sticky top-28">
  <div class="flex flex-col">
    @for (item of menuItems; track item; let last = $last) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-brand-orange-light/20 text-brand-orange border-r-4 border-brand-orange"
        [routerLinkActiveOptions]="{ exact: false }"
        #rla="routerLinkActive"
        class="flex items-center gap-3.5 py-3.5 px-5 hover:bg-gray-50 transition-colors cursor-pointer group"
        [class.border-b]="!last"
        [class.border-gray-100]="!last"
      >
        <div
          class="w-8 h-8 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform"
          [ngClass]="
            rla.isActive
              ? 'bg-brand-orange text-white'
              : 'bg-gray-50 text-gray-500 group-hover:text-brand-orange'
          "
        >
          <ng-icon [name]="item.icon" size="18" strokeWidth="2"></ng-icon>
        </div>
        <span
          class="font-bold text-[14px]"
          [ngClass]="
            rla.isActive ? 'text-brand-orange' : 'text-gray-700 group-hover:text-brand-orange'
          "
        >
          {{ item.label }}
        </span>
        <div class="ml-auto" [ngClass]="rla.isActive ? 'text-brand-orange' : 'text-gray-300'">
          <ng-icon
            name="lucideChevronRight"
            size="18"
            class="transition-transform group-hover:translate-x-1"
          ></ng-icon>
        </div>
      </a>
    }

    <!-- Sign Out -->
    <button
      (click)="logout()"
      class="flex items-center gap-3.5 py-3.5 px-5 hover:bg-red-50 transition-colors cursor-pointer group border-t border-gray-100"
    >
      <div
        class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center group-hover:scale-110 transition-transform"
      >
        <ng-icon name="lucideLogOut" size="18" strokeWidth="2"></ng-icon>
      </div>
      <span class="font-bold text-[14px] text-red-600"> Sign Out </span>
    </button>
  </div>
</div>
