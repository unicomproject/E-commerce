<div class="p-3 lg:p-4 flex flex-row items-start gap-3 lg:gap-4 bg-white relative group transition-colors">
  
  <!-- Checkbox -->
  <label class="flex-shrink-0 cursor-pointer self-center">
    <input type="checkbox" 
           [checked]="isSelected()" 
           (change)="onToggleSelect.emit(item().id)"
           class="w-[18px] h-[18px] rounded text-brand-orange border-gray-300 focus:ring-brand-orange accent-brand-orange transition-all cursor-pointer">
  </label>

  <!-- Product Image -->
  <div class="w-20 h-20 lg:w-24 lg:h-24 bg-gray-50 rounded-lg overflow-hidden flex-shrink-0">
    <img *ngIf="item().imageUrl" [src]="item().imageUrl" [alt]="item().name" class="w-full h-full object-cover">
  </div>
  
  <!-- Details Container -->
  <div class="flex-1 flex flex-col min-w-0 py-0.5">
    
    <!-- 1. Top Row: Title & Trash -->
    <div class="flex justify-between items-start gap-2">
      <h3 class="text-[15px] lg:text-[16px] font-bold text-gray-900 leading-none truncate">{{item().name}}</h3>
      <button (click)="removeItem()" class="flex-shrink-0 text-gray-400 hover:text-red-500 transition-colors">
        <ng-icon name="lucideTrash2" size="18"></ng-icon>
      </button>
    </div>
    
    <!-- 2. Unit Price -->
    <div class="font-extrabold text-[15px] lg:text-[16px] text-brand-orange leading-none mt-1">
      {{ item().unitPrice | tenantCurrency:'symbol':'1.2-2' }}
    </div>

    <!-- 3. Variant -->
    <div *ngIf="item().options?.length" class="text-[12px] lg:text-[13px] text-gray-500 flex flex-wrap items-center gap-1.5 mt-0.5">
      <ng-container *ngFor="let opt of item().options; let last = last">
        <span>{{opt.name}}: {{opt.value}}</span>
        <span *ngIf="!last" class="text-gray-300">|</span>
      </ng-container>
    </div>
    
    <!-- 4. Stock & 5. Stepper -->
    <div class="flex justify-between items-center mt-auto">
      <!-- Stock -->
      <div>
        <div *ngIf="item().isInStock" class="flex items-center text-[#22C55E] text-[11px] lg:text-[12px] font-bold bg-[#DCFCE7] w-fit px-2 py-0.5 rounded-full">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          In stock
        </div>
        <div *ngIf="!item().isInStock" class="flex items-center text-red-500 text-[11px] lg:text-[12px] font-bold bg-red-50 w-fit px-2 py-0.5 rounded-full">
          Out of stock
        </div>
      </div>
      
      <!-- Stepper -->
      <div class="w-24 lg:w-28">
        <app-quantity-stepper 
          [quantity]="item().quantity" 
          (quantityChange)="updateQuantity($event)">
        </app-quantity-stepper>
      </div>
    </div>
    
  </div>
</div>
