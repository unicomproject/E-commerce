<div class="search-page pb-24 lg:pb-12 bg-page-bg min-h-screen">
  
  <div class="w-full max-w-[1600px] mx-auto px-4 lg:px-6 lg:px-8 pt-0 pb-6">

    <!-- Breadcrumbs -->
    <div class="hidden lg:block pt-4 pb-2">
      <app-breadcrumbs [items]="breadcrumbItems()"></app-breadcrumbs>
    </div>

    <!-- Arrow & Search Bar (Mobile only) -->
    <app-mobile-header backLink="/">
      <div class="relative w-full">
        <app-search-bar></app-search-bar>
      </div>
    </app-mobile-header>

    <!-- Filter left · Grid/List right -->
    <div class="mb-4 flex flex-row items-center justify-between gap-3">
      <app-filter-sort-button></app-filter-sort-button>

      <div class="flex items-center gap-1 rounded-xl bg-[#F3F4F6] p-1">
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-lg transition-all"
          [class]="layout() === 'grid'
            ? 'bg-white text-[#111111] shadow-[0_1px_3px_rgba(0,0,0,0.1)]'
            : 'text-[#9CA3AF] hover:text-[#111111]'"
          (click)="setLayout('grid')"
          aria-label="Grid view"
        >
          <ng-icon name="lucideLayoutGrid" class="text-[18px]"></ng-icon>
        </button>
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-lg transition-all"
          [class]="layout() === 'list'
            ? 'bg-white text-[#111111] shadow-[0_1px_3px_rgba(0,0,0,0.1)]'
            : 'text-[#9CA3AF] hover:text-[#111111]'"
          (click)="setLayout('list')"
          aria-label="List view"
        >
          <ng-icon name="lucideList" class="text-[18px]"></ng-icon>
        </button>
      </div>
    </div>    <!-- Loading State -->
    <ng-container *ngIf="loading() && page() === 1">
      <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 lg:gap-4 mt-4">
        <div *ngFor="let i of [1,2,3,4]" class="animate-pulse flex flex-col">
          <div class="bg-gray-200 aspect-[4/5] rounded-xl mb-3"></div>
          <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
          <div class="h-3 bg-gray-200 rounded w-1/2 mb-3"></div>
          <div class="h-5 bg-gray-200 rounded w-1/4"></div>
        </div>
      </div>
    </ng-container>

    <!-- Empty State -->
    <ng-container *ngIf="!loading() && totalCount() === 0">
      <div class="text-center py-20 mt-4">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4 text-gray-400">
          <ng-icon name="lucideSearch" size="32"></ng-icon>
        </div>
        <h3 class="text-lg font-medium text-gray-900 mb-1">No results found</h3>
        <p class="text-gray-500">Try adjusting your search or filters to find what you're looking for.</p>
      </div>
    </ng-container>

    <ng-container *ngIf="!loading() && products().length > 0">
      
      <!-- Products Grid -->
      <div
        class="gap-3 lg:gap-4"
        [ngClass]="layout() === 'grid'
          ? 'grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6'
          : 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3'"
      >
        <app-product-card *ngFor="let product of products()" [product]="product" [layout]="layout()"></app-product-card>
      </div>

      <!-- Scroll Sentinel & Infinite Scroll Spinner -->
      <div #scrollSentinel class="w-full h-12 mt-6 mb-4 flex justify-center items-center">
        <ng-icon *ngIf="loadingMore()" name="lucideLoader2" class="text-[#FF6A00] text-[28px] animate-spin"></ng-icon>
      </div>
    </ng-container>

  </div>
</div>
