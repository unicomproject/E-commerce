<div class="flex items-stretch gap-3 p-3 sm:p-4">
  <label class="flex shrink-0 cursor-pointer items-center">
    <input
      type="checkbox"
      [checked]="isSelected()"
      (change)="onToggleSelect.emit(item().id)"
      class="hidden"
    />
    <div
      class="flex h-5 w-5 items-center justify-center rounded border transition-colors"
      [ngClass]="isSelected() ? 'border-brand-orange bg-brand-orange' : 'border-[#CBD5E1] bg-white'"
    >
      @if (isSelected()) {
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      }
    </div>
  </label>

  <div
    class="relative h-[88px] w-[88px] shrink-0 overflow-hidden rounded-lg bg-[#F5F5F5] sm:h-[96px] sm:w-[96px]"
  >
    @if (item().imageUrl) {
      <app-lazy-media-image
        class="absolute inset-0 block h-full w-full"
        [src]="item().imageUrl"
        [alt]="item().name"
        [priority]="true"
        fit="contain"
      />
    }
  </div>

  <div class="flex min-w-0 flex-1 flex-col justify-between py-0.5">
    <div class="min-w-0">
      <h3 class="line-clamp-2 text-[14px] font-semibold leading-snug text-[#111111]">
        {{ item().name }}
      </h3>
      @if (item().options?.length) {
        <p class="mt-0.5 truncate text-[12px] leading-snug text-[#666666]">
          @for (opt of item().options; track opt.name; let last = $last) {
            <span>{{ opt.name }}: {{ opt.value }}</span>
            @if (!last) {
              <span>, </span>
            }
          }
        </p>
      }
    </div>

    <div class="mt-2 flex items-center justify-between gap-3">
      <span class="shrink-0 text-[16px] font-bold leading-none text-[#111111]">
        <app-price [value]="item().unitPrice"></app-price>
      </span>

      <div
        class="flex h-8 shrink-0 items-center overflow-hidden rounded-lg border border-[#EAEAEA] bg-white"
      >
        <button
          type="button"
          (click)="decrement()"
          class="flex h-8 w-8 items-center justify-center text-[#666666] transition-colors hover:bg-[#F5F5F5] disabled:opacity-40"
          [disabled]="item().quantity <= 1"
          aria-label="Decrease quantity"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <div
          class="flex h-8 min-w-[28px] items-center justify-center border-x border-[#EAEAEA] text-[13px] font-semibold text-[#111111]"
        >
          {{ item().quantity }}
        </div>
        <button
          type="button"
          (click)="increment()"
          class="flex h-8 w-8 items-center justify-center text-brand-orange transition-colors hover:bg-brand-orange-light"
          aria-label="Increase quantity"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
