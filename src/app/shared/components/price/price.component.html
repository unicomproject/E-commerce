<span [ngClass]="className()" class="inline-flex items-center leading-none gap-[1px]">
  <span class="text-[0.60em] font-semibold leading-none mr-[0.1em] tracking-tight">{{ currencyCode() }}</span>
  <span class="text-[1em] font-bold leading-none tracking-tight">{{ integerPart() }}</span>
  <span class="text-[0.60em] font-semibold leading-none tracking-tight">{{ decimalPart() }}</span>
</span>
