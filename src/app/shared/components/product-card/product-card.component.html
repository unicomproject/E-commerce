@if (product(); as product) {
  <!-- ===================== GRID CARD ===================== -->
  @if (layout() === 'grid') {
    <a
      [routerLink]="['/product', product.slug]"
      class="group flex h-full flex-col overflow-hidden rounded-[12px] border border-[#EAEAEA] bg-white shadow-sm transition-shadow hover:shadow-md"
    >
      <div class="relative flex h-[160px] w-full flex-shrink-0 items-center justify-center overflow-hidden bg-[#F5F5F5] lg:h-[180px]">
        <img
          [ngSrc]="product.imageUrl || 'assets/placeholder-product.png'"
          [alt]="product.name"
          class="object-cover transition-transform duration-300 group-hover:scale-105"
          fill
        />

        <button
          type="button"
          class="absolute right-0 top-0 z-20 flex h-[44px] w-[44px] items-center justify-center transition-colors"
          [class]="isInWishlist() ? 'text-[#FF6A00]' : 'text-[#666666] hover:text-[#FF6A00]'"
          (click)="toggleWishlist($event)"
          aria-label="Toggle wishlist"
        >
          <ng-icon name="lucideHeart" class="text-[20px]" [class.fill-current]="isInWishlist()"></ng-icon>
        </button>
      </div>

      <div class="flex flex-1 flex-col p-3">
        <!-- 1. Name -->
        <h4 class="line-clamp-2 text-[14px] font-bold leading-snug text-[#111111] transition-colors group-hover:text-[#FF6A00] lg:text-[18px] lg:font-semibold lg:leading-[26px]">
          {{ product.name }}
        </h4>

        <!-- 2. Price -->
        <p class="mt-1 text-[14px] font-bold text-[#111111]">
          {{ product.price | tenantCurrency:'symbol':'1.0-2' }}
        </p>

        <!-- 3. Stars + review count -->
        <div class="mt-1.5 flex items-center gap-1">
          <app-star-rating [rating]="ratingValue()" [size]="12"></app-star-rating>
          <span class="text-[12px] font-normal text-[#111111]">({{ reviewCount() }})</span>
        </div>
      </div>
    </a>
  }

  <!-- ===================== LIST CARD ===================== -->
  @if (layout() === 'list') {
    <a
      [routerLink]="['/product', product.slug]"
      class="group flex overflow-hidden rounded-[12px] border border-[#EAEAEA] bg-white shadow-sm transition-shadow hover:shadow-md"
    >
      <div class="relative h-[120px] w-[120px] flex-shrink-0 overflow-hidden bg-[#F5F5F5]">
        <img
          [ngSrc]="product.imageUrl || 'assets/placeholder-product.png'"
          [alt]="product.name"
          class="object-cover"
          fill
        />
      </div>

      <div class="relative flex min-w-0 flex-1 flex-col justify-center p-3">
        <button
          type="button"
          class="absolute right-0 top-0 z-20 flex h-[44px] w-[44px] items-center justify-center transition-colors"
          [class]="isInWishlist() ? 'text-[#FF6A00]' : 'text-[#666666] hover:text-[#FF6A00]'"
          (click)="toggleWishlist($event)"
          aria-label="Toggle wishlist"
        >
          <ng-icon name="lucideHeart" class="text-[20px]" [class.fill-current]="isInWishlist()"></ng-icon>
        </button>

        <h4 class="pr-8 line-clamp-2 text-[14px] font-bold leading-snug text-[#111111] transition-colors group-hover:text-[#FF6A00]">
          {{ product.name }}
        </h4>

        <p class="mt-1 text-[14px] font-bold text-[#111111]">
          {{ product.price | tenantCurrency:'symbol':'1.0-2' }}
        </p>

        <div class="mt-1.5 flex items-center gap-1">
          <app-star-rating [rating]="ratingValue()" [size]="12"></app-star-rating>
          <span class="text-[12px] font-normal text-[#111111]">({{ reviewCount() }})</span>
        </div>
      </div>
    </a>
  }
}
